name: Deploy to AWS

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # This is required for requesting the JWT token used to authenticate to AWS

concurrency:
  group: "deploy"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      ######
      # Validate trigger
      ######
      - name: Validate tag (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "${{ github.ref_type }}" != "tag" || ! "${{ github.ref_name }}" =~ ^v ]]; then
            echo "::error::Deploy must be run from a tag matching 'v*' (got ref_type=${{ github.ref_type }}, ref_name=${{ github.ref_name }})"
            exit 1
          fi
      ######
      # Build
      ######
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Build
        env:
          URL_PREFIX: https://token-anonymizer.owlbear.davidsev.co.uk/${{ github.ref_name }}
        run: npm run build
      ######
      # Login to AWS
      ######
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: eu-west-2
          role-session-name: Github
      ######
      # Push to s3
      ######
      - name: Deploy to S3
        run: |
          aws s3 sync --metadata-directive REPLACE --cache-control "public, max-age=31536000, immutable" ./dist "s3://${{ secrets.S3_BUCKET }}/${{ github.ref_name }}" --delete
      - name: Update root files (stable releases only)
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          aws s3 cp --metadata-directive REPLACE --cache-control 'public, max-age=300' ./dist/manifest.json "s3://${{ secrets.S3_BUCKET }}/"
          aws s3 cp --metadata-directive REPLACE --cache-control 'public, max-age=3600' --recursive ./static_root/ "s3://${{ secrets.S3_BUCKET }}/"
